/* ----------------------- event handling ----------------------- */

function onClick(e) {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.getAttribute('data-action');
  const id = target.getAttribute('data-id');
  const parent = target.getAttribute('data-parent');

  switch (action) {
    case 'close-error-popup':
      ui.errorPopup = null;
      render();
      break;
    case 'toggle-all-weeks':
      ui.showAllWeeks = !ui.showAllWeeks;
      render();
      break;
    case 'cal-prev':
      ui.calendarMonth = shiftYearMonth(ui.calendarMonth || currentYearMonth(), -1);
      render();
      break;
    case 'cal-next':
      ui.calendarMonth = shiftYearMonth(ui.calendarMonth || currentYearMonth(), 1);
      render();
      break;
    case 'cal-today':
      ui.calendarMonth = currentYearMonth();
      ui.selectedCalDay = todayISO();
      ui.showAddAbwesenheit = false;
      ui.editingAbwesenheitId = null;
      render();
      break;
    case 'select-cal-day':
      ui.selectedCalDay = ui.selectedCalDay === id ? null : id;
      ui.showAddAbwesenheit = false;
      ui.editingAbwesenheitId = null;
      render();
      break;
    case 'close-cal-day':
      ui.selectedCalDay = null;
      ui.showAddAbwesenheit = false;
      ui.editingAbwesenheitId = null;
      render();
      break;
    case 'show-add-abwesenheit':
      ui.showAddAbwesenheit = true;
      render();
      break;
    case 'cancel-add-abwesenheit':
      ui.showAddAbwesenheit = false;
      render();
      break;
    case 'edit-abwesenheit':
      ui.editingAbwesenheitId = id;
      ui.showAddAbwesenheit = false;
      if (!ui.selectedCalDay) {
        const a = (state.abwesenheiten || []).find(x => x.id === id);
        if (a) ui.selectedCalDay = a.start;
      }
      render();
      break;
    case 'cancel-edit-abwesenheit':
      ui.editingAbwesenheitId = null;
      render();
      break;
    case 'delete-abwesenheit':
      if (confirm('Diese Abwesenheit wirklich löschen?')) {
        state.abwesenheiten = (state.abwesenheiten || []).filter(x => x.id !== id);
        ui.editingAbwesenheitId = null;
        persist();
        render();
      }
      break;
    case 'toggle-card':
      if (ui.expanded.has(id)) ui.expanded.delete(id); else ui.expanded.add(id);
      render();
      break;
    case 'show-add-assignment':
      ui.showAddAssignment = true;
      render();
      document.querySelector('[name="land"]')?.focus();
      break;
    case 'cancel-add-assignment':
      ui.showAddAssignment = false;
      render();
      break;
    case 'edit-assignment':
      ui.editingAssignmentId = id;
      render();
      break;
    case 'cancel-edit-assignment':
      ui.editingAssignmentId = null;
      render();
      break;
    case 'delete-assignment': {
      const a = state.assignments.find(x => x.id === id);
      const label = a ? placeLabel(a) : 'diese Dienstreise';
      if (confirm(`"${label}" inkl. aller erfassten Tage wirklich löschen?`)) {
        state.assignments = state.assignments.filter(x => x.id !== id);
        ui.expanded.delete(id);
        persist();
        render();
      }
      break;
    }
    case 'show-add-day':
      ui.addingDayFor = id;
      ui.editingDayId = null;
      render();
      break;
    case 'cancel-add-day':
      ui.addingDayFor = null;
      render();
      break;
    case 'edit-day':
      ui.editingDayId = id;
      ui.addingDayFor = null;
      render();
      break;
    case 'cancel-edit-day':
      ui.editingDayId = null;
      render();
      break;
    case 'delete-day': {
      const a = state.assignments.find(x => x.id === parent);
      if (a && confirm('Diesen Tageseintrag wirklich löschen?')) {
        a.tage = (a.tage || []).filter(d => d.id !== id);
        persist();
        render();
      }
      break;
    }
    case 'export-csv-all':
      exportAllCSV();
      break;
    case 'export-csv-assignment':
      exportAssignmentCSV(id);
      break;
    case 'print-single-assignment':
      printSingleAssignment(id);
      break;
    case 'export-json':
      exportJSON();
      break;
    case 'clear-autoday-times': {
      const panel = target.closest('.autoday-block');
      if (panel) {
        panel.querySelectorAll('select[name^="arbeitStart_"], select[name^="arbeitEnde_"]').forEach(sel => { sel.value = ''; });
      }
      break;
    }
    case 'do-sync':
      doSync();
      break;
    case 'copy-bin-id': {
      const value = target.getAttribute('data-value') || '';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(() => {
          showInfo('Kopiert', 'Bin-ID wurde in die Zwischenablage kopiert.');
        }).catch(() => {
          showError('Kopieren fehlgeschlagen', 'Bitte die Bin-ID manuell markieren und kopieren.');
        });
      } else {
        showError('Kopieren nicht verfügbar', 'Bitte die Bin-ID manuell markieren und kopieren.');
      }
      break;
    }
    case 'toggle-sync-settings':
      ui.showSyncSettings = !ui.showSyncSettings;
      render();
      break;
    case 'cancel-sync-settings':
      ui.showSyncSettings = false;
      render();
      break;
    case 'remove-sync-settings':
      if (confirm('Cloud-Sync-Verbindung auf diesem Gerät entfernen? Die Daten in der Cloud bleiben bestehen, nur die Verknüpfung hier wird gelöscht.')) {
        clearSyncConfig();
        ui.showSyncSettings = false;
        render();
      }
      break;
    case 'print-all':
      printAll();
      break;
    default:
      break;
  }
}

function onSubmit(e) {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const type = form.getAttribute('data-form');
  const fd = new FormData(form);

  if (type === 'add-abwesenheit') {
    const typ = (fd.get('typ') || '').toString();
    const start = (fd.get('start') || '').toString();
    const ende = (fd.get('ende') || '').toString();
    if (!typ || !start || !ende) { showError('Angaben fehlen', 'Bitte Art, Start- und Enddatum angeben.'); return; }
    if (ende < start) { showError('Ungültiger Zeitraum', 'Das Enddatum liegt vor dem Startdatum.'); return; }
    if (!Array.isArray(state.abwesenheiten)) state.abwesenheiten = [];
    state.abwesenheiten.push({
      id: uid(), typ, start, ende,
      notiz: (fd.get('notiz') || '').toString().trim()
    });
    ui.showAddAbwesenheit = false;
    persist();
    render();
  }

  if (type === 'edit-abwesenheit') {
    const abwId = form.getAttribute('data-id');
    const x = (state.abwesenheiten || []).find(a => a.id === abwId);
    if (!x) return;
    const typ = (fd.get('typ') || '').toString();
    const start = (fd.get('start') || '').toString();
    const ende = (fd.get('ende') || '').toString();
    if (!typ || !start || !ende) { showError('Angaben fehlen', 'Bitte Art, Start- und Enddatum angeben.'); return; }
    if (ende < start) { showError('Ungültiger Zeitraum', 'Das Enddatum liegt vor dem Startdatum.'); return; }
    x.typ = typ;
    x.start = start;
    x.ende = ende;
    x.notiz = (fd.get('notiz') || '').toString().trim();
    ui.editingAbwesenheitId = null;
    persist();
    render();
  }

  if (type === 'add-assignment') {
    const land = (fd.get('land') || '').toString().trim();
    const start = (fd.get('start') || '').toString();
    if (!land || !start) { showError('Angaben fehlen', 'Bitte mindestens Land und Startdatum angeben.'); return; }
    const ende = (fd.get('ende') || '').toString() || null;
    const neu = {
      id: uid(),
      land,
      ort: (fd.get('ort') || '').toString().trim(),
      kunde: (fd.get('kunde') || '').toString().trim(),
      start,
      ende,
      tagessatz: fd.get('tagessatz') ? Number(fd.get('tagessatz')) : 0,
      uebernachtungspauschale: fd.get('uebernachtungspauschale') ? Number(fd.get('uebernachtungspauschale')) : 0,
      notiz: (fd.get('notiz') || '').toString().trim(),
      tage: []
    };
    state.assignments.push(neu);

    let autoInfo = '';
    if (ende) {
      const wdKeys = { 0: 'wd_so', 1: 'wd_mo', 2: 'wd_di', 3: 'wd_mi', 4: 'wd_do', 5: 'wd_fr', 6: 'wd_sa' };
      const activeWeekdays = new Set();
      Object.keys(wdKeys).forEach(dow => { if (fd.get(wdKeys[dow])) activeWeekdays.add(Number(dow)); });
      const arbeitStart = combineTimeFromForm(fd, 'arbeitStart');
      const arbeitEnde = combineTimeFromForm(fd, 'arbeitEnde');
      const { created } = generateDaysForRange(neu, start, ende, activeWeekdays, arbeitStart, arbeitEnde, 0, false, false, false, '');
      if (created > 0) {
        autoInfo = ` ${created} Tag(e) wurden automatisch angelegt (Verpflegung durchgängig, Arbeitszeit an den gewählten Wochentagen). Randtage bei Bedarf um Reisezeit ergänzen.`;
        ui.expanded.add(neu.id); // nur aufklappen, wenn es auch etwas zu zeigen gibt
      }
    }

    ui.showAddAssignment = false;
    persist();
    render();
    if (autoInfo) showInfo('Dienstreise angelegt', autoInfo.trim());
  }

  if (type === 'edit-assignment') {
    const id = form.getAttribute('data-id');
    const a = state.assignments.find(x => x.id === id);
    if (!a) return;
    const land = (fd.get('land') || '').toString().trim();
    const start = (fd.get('start') || '').toString();
    if (!land || !start) { showError('Angaben fehlen', 'Bitte mindestens Land und Startdatum angeben.'); return; }
    a.land = land;
    a.ort = (fd.get('ort') || '').toString().trim();
    a.kunde = (fd.get('kunde') || '').toString().trim();
    a.start = start;
    a.ende = (fd.get('ende') || '').toString() || null;
    a.tagessatz = fd.get('tagessatz') ? Number(fd.get('tagessatz')) : 0;
    a.uebernachtungspauschale = fd.get('uebernachtungspauschale') ? Number(fd.get('uebernachtungspauschale')) : 0;
    a.notiz = (fd.get('notiz') || '').toString().trim();
    ui.editingAssignmentId = null;
    persist();
    render();
  }

  if (type === 'add-day') {
    const parentId = form.getAttribute('data-parent');
    const a = state.assignments.find(x => x.id === parentId);
    if (!a) return;
    const datum = (fd.get('datum') || '').toString();
    if (!datum) { showError('Datum fehlt', 'Bitte ein Datum angeben.'); return; }
    if (!a.tage) a.tage = [];

    const isBulk = !!form.querySelector('.bulk-toggle-checkbox:checked');

    if (isBulk) {
      const bulkEnde = (fd.get('bulkEnde') || '').toString();
      if (!bulkEnde) { showError('Enddatum fehlt', 'Bitte für die Serienerfassung ein Enddatum ("Bis") angeben.'); return; }
      if (bulkEnde < datum) { showError('Ungültiger Zeitraum', 'Das Enddatum liegt vor dem Startdatum.'); return; }
      const wdKeys = { 0: 'wd_so', 1: 'wd_mo', 2: 'wd_di', 3: 'wd_mi', 4: 'wd_do', 5: 'wd_fr', 6: 'wd_sa' };
      const activeWeekdays = new Set();
      Object.keys(wdKeys).forEach(dow => { if (fd.get(wdKeys[dow])) activeWeekdays.add(Number(dow)); });

      const arbeitStart = combineTimeFromForm(fd, 'arbeitStart');
      const arbeitEnde = combineTimeFromForm(fd, 'arbeitEnde');
      const manualSpesen = fd.get('spesen') ? Number(fd.get('spesen')) : 0;
      const fruehstueck = !!fd.get('mahlzeit_fruehstueck');
      const mittag = !!fd.get('mahlzeit_mittag');
      const abend = !!fd.get('mahlzeit_abend');
      const notiz = (fd.get('notiz') || '').toString().trim();

      const { created, skipped } = generateDaysForRange(a, datum, bulkEnde, activeWeekdays, arbeitStart, arbeitEnde, manualSpesen, fruehstueck, mittag, abend, notiz);
      ui.lastDate = { parent: a.id, value: addDaysISO(bulkEnde, 1) };
      persist();
      render();
      if (created === 0) {
        showError('Keine Tage angelegt', `Alle ${skipped} Tage im Zeitraum waren bereits erfasst.`);
      } else if (skipped > 0) {
        showInfo('Serienerfassung abgeschlossen', `${created} Tag(e) angelegt, ${skipped} bereits vorhandene(r) Tag(e) übersprungen.`);
      }
      return;
    }

    const isFrei = !!form.querySelector('.frei-toggle-checkbox:checked');
    a.tage.push({
      id: uid(),
      datum,
      reiseStart: combineTimeFromForm(fd, 'reiseStart'),
      reiseEnde: combineTimeFromForm(fd, 'reiseEnde'),
      arbeitStart: isFrei ? '' : combineTimeFromForm(fd, 'arbeitStart'),
      arbeitEnde: isFrei ? '' : combineTimeFromForm(fd, 'arbeitEnde'),
      frei: isFrei,
      spesen: fd.get('spesen') ? Number(fd.get('spesen')) : 0,
      fruehstueck: !!fd.get('mahlzeit_fruehstueck'),
      mittag: !!fd.get('mahlzeit_mittag'),
      abend: !!fd.get('mahlzeit_abend'),
      notiz: (fd.get('notiz') || '').toString().trim()
    });
    ui.lastDate = { parent: a.id, value: addDaysISO(datum, 1) };
    persist();
    render();
    document.querySelector(`form[data-form="add-day"] input[name="datum"]`)?.focus();
  }

  if (type === 'edit-day') {
    const parentId = form.getAttribute('data-parent');
    const dayId = form.getAttribute('data-id');
    const a = state.assignments.find(x => x.id === parentId);
    if (!a) return;
    const d = (a.tage || []).find(x => x.id === dayId);
    if (!d) return;
    const datum = (fd.get('datum') || '').toString();
    if (!datum) { showError('Datum fehlt', 'Bitte ein Datum angeben.'); return; }
    d.datum = datum;
    const isFrei = !!form.querySelector('.frei-toggle-checkbox:checked');
    d.reiseStart = combineTimeFromForm(fd, 'reiseStart');
    d.reiseEnde = combineTimeFromForm(fd, 'reiseEnde');
    d.arbeitStart = isFrei ? '' : combineTimeFromForm(fd, 'arbeitStart');
    d.arbeitEnde = isFrei ? '' : combineTimeFromForm(fd, 'arbeitEnde');
    d.frei = isFrei;
    d.spesen = fd.get('spesen') ? Number(fd.get('spesen')) : 0;
    d.fruehstueck = !!fd.get('mahlzeit_fruehstueck');
    d.mittag = !!fd.get('mahlzeit_mittag');
    d.abend = !!fd.get('mahlzeit_abend');
    d.notiz = (fd.get('notiz') || '').toString().trim();
    ui.editingDayId = null;
    persist();
    render();
  }

  if (type === 'sync-settings') {
    const apiKey = (fd.get('apiKey') || '').toString().trim();
    const binId = (fd.get('binId') || '').toString().trim();
    if (!apiKey) { showError('Angaben fehlen', 'Bitte den Master-Key eintragen.'); return; }
    const existing = getSyncConfig();
    const isFirstTimeSetup = !binId && (!existing || !existing.binId);
    setSyncConfig({ apiKey, binId: binId || (existing ? existing.binId : ''), lastSyncedAt: existing ? existing.lastSyncedAt : 0 });
    ui.showSyncSettings = false;
    render();
    doSync().then(() => {
      if (isFirstTimeSetup) {
        // Neue Bin-ID wurde gerade erzeugt - Panel automatisch wieder öffnen, damit sie sofort sichtbar
        // und kopierbar ist, statt sie erst über "Verbindung" erneut suchen zu müssen.
        ui.showSyncSettings = true;
        render();
      }
    });
  }
}

function autofillOneField(input, value, existing) {
  if (!input) return;
  const wasAutofilled = input.dataset.autofilled === '1';
  if (input.value && !wasAutofilled) return; // Nutzer hat selbst etwas eingetragen - nicht anfassen
  if (value !== null && value !== undefined) {
    input.value = value;
    input.dataset.autofilled = '1';
  } else if (wasAutofilled) {
    input.value = '';
    delete input.dataset.autofilled;
  }
}

function tryAutofillTagessatz(form) {
  const landInput = form.querySelector('input[name="land"]');
  const ortInput = form.querySelector('input[name="ort"]');
  const startInput = form.querySelector('input[name="start"]');
  const tagessatzInput = form.querySelector('input[name="tagessatz"]');
  const uebernachtungInput = form.querySelector('input[name="uebernachtungspauschale"]');
  if (!landInput || !startInput) return;
  const year = startInput.value ? Number(startInput.value.slice(0, 4)) : null;
  const entry = year ? lookupLaenderSatz(landInput.value, ortInput ? ortInput.value : '', year) : null;
  autofillOneField(tagessatzInput, entry ? entry.tag : null);
  autofillOneField(uebernachtungInput, entry && entry.uebernachtung !== undefined ? entry.uebernachtung : null);
}

function recalcVerpflegung(form) {
  const parentId = form.getAttribute('data-parent');
  const a = state.assignments.find(x => x.id === parentId);
  if (!a || !a.tagessatz || a.tagessatz <= 0) return;
  const datum = form.querySelector('input[name="datum"]');
  const spesenInput = form.querySelector('input[name="spesen"]');
  if (!datum || !spesenInput) return;
  const edge = isEdgeDay(a, datum.value);
  const fr = form.querySelector('input[name="mahlzeit_fruehstueck"]');
  const mi = form.querySelector('input[name="mahlzeit_mittag"]');
  const ab = form.querySelector('input[name="mahlzeit_abend"]');
  const betrag = verpflegungBetrag(a.tagessatz, edge, fr && fr.checked, mi && mi.checked, ab && ab.checked, isGermanAssignment(a));
  spesenInput.value = betrag > 0 ? betrag.toFixed(2) : '';
}

    renderComboOptions(comboInput);

    closeAllCombos();

function onChange(e) {
  const fileInput = e.target.closest('[data-action="import-json-file"]');
  if (fileInput && fileInput.files && fileInput.files[0]) {
    importJSONFile(fileInput.files[0]);
    fileInput.value = '';
    return;
  }
  const tagessatzManual = e.target.closest('form[data-form="add-assignment"] input[name="tagessatz"], form[data-form="edit-assignment"] input[name="tagessatz"]');
  if (tagessatzManual) {
    delete tagessatzManual.dataset.autofilled;
    return;
  }
  const uebernachtungManual = e.target.closest('form[data-form="add-assignment"] input[name="uebernachtungspauschale"], form[data-form="edit-assignment"] input[name="uebernachtungspauschale"]');
  if (uebernachtungManual) {
    delete uebernachtungManual.dataset.autofilled;
    return;
  }
  const landOrStartInput = e.target.closest(
    'form[data-form="add-assignment"] input[name="land"], form[data-form="edit-assignment"] input[name="land"], ' +
    'form[data-form="add-assignment"] input[name="ort"], form[data-form="edit-assignment"] input[name="ort"], ' +
    'form[data-form="add-assignment"] input[name="start"], form[data-form="edit-assignment"] input[name="start"]'
  );
  if (landOrStartInput) {
    const form = landOrStartInput.closest('form');
    if (landOrStartInput.matches('input[name="land"]')) {
      const ortInput = form.querySelector('input[name="ort"]');
      const ortWrap = ortInput && ortInput.closest('.combo-wrap');
      if (ortWrap) {
        const hasOrte = allKnownOrteForLand(landOrStartInput.value).length > 0;
        ortWrap.classList.toggle('combo-has-options', hasOrte);
      }
    }
    tryAutofillTagessatz(form);
    return;
  }
  const bulkCheck = e.target.closest('.bulk-toggle-checkbox');
  if (bulkCheck) {
    const form = bulkCheck.closest('form');
    if (form) {
      const reiseWrap = form.querySelector('.reise-toggle-wrap');
      const freiWrap = form.querySelector('.frei-toggle-wrap');
      if (reiseWrap) reiseWrap.style.display = bulkCheck.checked ? 'none' : '';
      if (freiWrap) freiWrap.style.display = bulkCheck.checked ? 'none' : '';
    }
    return;
  }
  const freiCheck = e.target.closest('.frei-toggle-checkbox');
  if (freiCheck) {
    const form = freiCheck.closest('form');
    if (form) {
      const arbeitWrap = form.querySelector('.arbeit-fields-wrap');
      if (arbeitWrap) arbeitWrap.classList.toggle('arbeit-fields-hidden', freiCheck.checked);
    }
    return;
  }
  const verpflegungCheck = e.target.closest('.verpflegung-check');
  if (verpflegungCheck) {
    const form = verpflegungCheck.closest('form');
    if (form) recalcVerpflegung(form);
    return;
  }
  const datumInput = e.target.closest('.day-edit-form input[name="datum"]');
  if (datumInput) {
    const form = datumInput.closest('form');
    if (form) recalcVerpflegung(form);
    return;
  }
  const urlaubInput = e.target.closest('[data-action="update-urlaubstage"]');
  if (urlaubInput) {
    let val = Number(urlaubInput.value);
    if (Number.isNaN(val) || val < 0) val = 0;
    if (val > 365) val = 365;
    if (!state.settings) state.settings = {};
    state.settings.urlaubstage = val;
    persist();
    render();
    return;
  }
  const sollInput = e.target.closest('[data-action="update-sollwochenstunden"]');
  if (sollInput) {
    let val = Number(sollInput.value);
    if (Number.isNaN(val) || val < 0) val = 0;
    if (val > 168) val = 168;
    if (!state.settings) state.settings = {};
    state.settings.sollWochenstunden = val;
    persist();
    render();
    return;
  }
  const nameInput = e.target.closest('[data-action="update-mitarbeiter-name"]');
  if (nameInput) {
    if (!state.settings) state.settings = {};
    state.settings.mitarbeiterName = nameInput.value.trim();
    persist();
    return;
  }
  const personalnrInput = e.target.closest('[data-action="update-personalnummer"]');
  if (personalnrInput) {
    if (!state.settings) state.settings = {};
    state.settings.personalnummer = personalnrInput.value.trim();
    persist();
    return;
  }
}

function onKeydown(e) {
  if (e.key === 'Escape' && ui.errorPopup) {
    ui.errorPopup = null;
    render();
    return;
  }
  const comboInput = e.target.closest('.combo-input');
  if (comboInput) {
    const wrap = comboInput.closest('.combo-wrap');
    if (e.key === 'Escape') {
      closeCombo(wrap);
      return;
    }
    if (e.key === 'Enter' && wrap && wrap.classList.contains('combo-open')) {
      const firstOption = wrap.querySelector('.combo-option');
      if (firstOption) {
        e.preventDefault();
        comboInput.value = firstOption.getAttribute('data-value');
        closeCombo(wrap);
        comboInput.dispatchEvent(new Event('change', { bubbles: true }));
      }
      return;
    }
  }
  const target = e.target.closest('[data-action="toggle-card"]');
  if (target && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    target.click();
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const app = document.getElementById('app');
  app.addEventListener('click', onClick);
  app.addEventListener('submit', onSubmit);
  app.addEventListener('keydown', onKeydown);
  app.addEventListener('change', onChange);
  app.addEventListener('input', onInput);
  app.addEventListener('focusin', onFocusIn);
  app.addEventListener('pointerdown', (e) => {
    const optionEl = e.target.closest('.combo-option');
    if (optionEl) {
      e.preventDefault(); // verhindert, dass das Eingabefeld vorher den Fokus verliert (blur) und
                           // das Dropdown dadurch schon zuklappt, bevor die Auswahl greift - v.a. auf Touch-Geräten.
      selectComboOption(optionEl);
    }
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.combo-wrap')) closeAllCombos();
  });
  init();
});
</script>
<script>
// Service Worker: nur relevant, wenn die Datei über eine echte URL (z.B. GitHub Pages)
// aufgerufen wird - lokal/als Claude-Artifact schlägt die Registrierung einfach fehl
// und wird stillschweigend ignoriert (kein Funktionsverlust).
if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      reg.update();
      setInterval(() => reg.update(), 60 * 60 * 1000); // stündlich erneut prüfen, falls die App lange offen bleibt
    }).catch(() => { /* kein SW-Support/keine gültige URL - kein Problem */ });
  });
}
</script>
