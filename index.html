<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dienstreise-Stundenzettel</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2f4a63">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dienstreise">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#eef0ef;
  --paper:#ffffff;
  --ink:#1b232b;
  --ink-soft:#5c6773;
  --ink-faint:#8b95a1;
  --line:#d7dbd9;
  --steel:#2f4a63;
  --steel-soft:#e2e8ee;
  --orange:#d6540c;
  --orange-soft:#fbe4d4;
  --green:#3f7a52;
  --green-soft:#e2eee5;
  --red:#b3432b;
  --red-soft:#f6e2dd;
  --urlaub:#2f7ab8;
  --sonderurlaub:#7c5cbf;
  --focus:#1f6fb2;
  --radius:10px;
  --shadow:0 1px 2px rgba(27,35,43,0.06), 0 4px 14px rgba(27,35,43,0.05);
}

*{ box-sizing:border-box; }

html,body{ margin:0; padding:0; }

body{
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}

.mono{ font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

#app{ max-width:980px; margin:0 auto; padding:28px 20px 60px; }

.print-only{ display:none; }

a, button, input{ font-family:inherit; }

button{ cursor:pointer; }

:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }

.loading{ padding:60px 0; text-align:center; color:var(--ink-soft); }

/* ---------- topbar ---------- */

.topbar{
  display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
  gap:18px; padding-bottom:20px; margin-bottom:18px; border-bottom:2px solid var(--ink);
}

.eyebrow{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--orange); font-weight:600; margin-bottom:4px;
}

.topbar h1{ margin:0; font-size:26px; font-weight:700; letter-spacing:-0.01em; }

.stats-row{ display:flex; gap:22px; flex-wrap:wrap; }

.stat{ display:flex; flex-direction:column; align-items:flex-end; min-width:64px; }

.stat-value{ font-size:18px; font-weight:600; color:var(--steel); }

.stat-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); margin-top:2px; }

/* ---------- timeline (signature element) ---------- */

.timeline-overview{ margin-bottom:22px; }

.timeline-bar{
  display:flex; width:100%; height:40px; border-radius:6px; overflow:hidden;
  border:1px solid var(--line); background:var(--paper);
}

.tl-seg{
  position:relative; display:flex; align-items:center; justify-content:center;
  min-width:6px; border-right:2px solid var(--bg); overflow:hidden;
  transition:filter .15s ease;
}

.tl-seg:last-child{ border-right:none; }

.tl-seg:hover{ filter:brightness(1.08); }

.seg-a{ background:var(--steel); }

.seg-b{ background:var(--orange); }

.tl-seg-label{
  font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; color:#fff;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 8px;
}

.timeline-range{
  display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint);
  margin-top:6px;
}

/* ---------- year summary ---------- */

.year-summary{ margin-bottom:22px; }

.year-summary-header{
  display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px;
  margin-bottom:12px;
}

.year-summary-header h2{ margin:0; font-size:16px; font-weight:700; }

.year-settings{
  font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;
}

.year-settings input{
  width:56px; border:1px solid var(--line); border-radius:6px; padding:4px 6px;
  font-family:'IBM Plex Mono', monospace; font-size:12.5px; background:var(--paper); color:var(--ink);
}

.year-card-list{ display:flex; gap:14px; flex-wrap:wrap; }

.year-card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:14px 16px; flex:1 1 220px; min-width:200px; max-width:280px;
}

.year-card-year{ font-size:20px; font-weight:700; color:var(--steel); margin-bottom:8px; }

.year-card-row{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px; }

.year-card-label{ color:var(--ink-soft); }

.year-card-value{ font-weight:600; }

.year-bar-track{
  height:8px; border-radius:5px; background:var(--bg); overflow:hidden; margin-bottom:6px;
}

.year-bar-fill{ height:100%; background:var(--steel); border-radius:5px; }

.year-bar-fill-hot{ background:var(--orange); }

.year-card-ratio{ font-size:12px; color:var(--ink); font-weight:600; margin-bottom:8px; }

.year-card-footer{ font-size:11.5px; color:var(--ink-faint); border-top:1px dashed var(--line); padding-top:8px; }

.year-summary-hint{ font-size:11px; color:var(--ink-faint); margin:10px 0 0; }

/* ---------- toolbar ---------- */

.toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }

.toolbar-spacer{ flex:1; }

.save-status{ font-size:11.5px; color:var(--green); min-width:0; }

.save-status.err{ color:var(--red); }

.btn{
  font-family:'IBM Plex Sans', sans-serif; font-size:13.5px; font-weight:600;
  padding:9px 16px; border-radius:7px; border:1px solid transparent; transition:background .15s ease, border-color .15s ease;
}

.btn-primary{ background:var(--ink); color:#fff; }

.btn-primary:hover{ background:var(--steel); }

.btn-ghost{ background:transparent; color:var(--ink); border-color:var(--line); }

.btn-ghost:hover{ border-color:var(--ink-soft); background:var(--paper); }

.btn-sm{ padding:6px 12px; font-size:12.5px; }

.btn.danger, .btn-ghost.danger{ color:var(--red); }

.btn.danger:hover, .btn-ghost.danger:hover{ border-color:var(--red); background:var(--red-soft); }

.link-btn{
  background:none; border:none; color:var(--ink-faint); font-size:12px; text-decoration:underline;
  padding:0;
}

.file-label{ cursor:pointer; }

.visually-hidden{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

.footer-actions{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; }

.footer-hint{ display:block; font-size:11px; color:var(--ink-faint); margin-top:2px; }

.footer-hint-warn{ color:var(--orange); }

/* ---------- sync bar ---------- */

.sync-bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--paper); border:1px solid var(--line); border-radius:8px;
  padding:9px 12px; margin-bottom:16px;
}

.sync-status-text{ font-size:12px; color:var(--ink-soft); }

.sync-status-text.err{ color:var(--red); }

.sync-pending{ box-shadow:0 0 0 3px var(--orange-soft); }

.bin-id-display{
  background:var(--bg); padding:2px 6px; border-radius:4px; font-weight:600; color:var(--steel);
}

.sync-binid-chip{
  font-size:11px; color:var(--ink-faint); background:var(--bg); padding:2px 8px; border-radius:10px;
  font-family:'IBM Plex Mono', monospace; cursor:default;
}

.binid-warning{
  background:var(--orange-soft); border:1px solid var(--orange); border-radius:8px;
  padding:10px 12px; margin-top:10px; font-size:12.5px; color:#8a3c08; line-height:1.5;
}

.binid-copy-row{ display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap; }

.panel-hint{ font-size:12px; color:var(--ink-soft); line-height:1.5; margin:8px 0 0; }

/* ---------- forms / panels ---------- */

.panel{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 18px 16px; margin-bottom:18px; box-shadow:var(--shadow);
}

.panel-title{ font-weight:600; font-size:14px; margin-bottom:14px; color:var(--steel); }

.form-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px 14px;
}

.field{ display:flex; flex-direction:column; gap:5px; }

.field-wide{ grid-column:1 / -1; }

.field-label{
  display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--ink-soft); font-weight:600;
}

.field input{
  border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:14px;
  background:var(--bg); color:var(--ink);
}

.field input:focus{ background:var(--paper); border-color:var(--steel); }

/* ---------- durchsuchbares Dropdown (Land/Ort) ---------- */

.combo-wrap{ position:relative; }

.combo-input{
  width:100%; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:14px;
  background:var(--bg); color:var(--ink); box-sizing:border-box;
}

.combo-input:focus{ background:var(--paper); border-color:var(--steel); }

.combo-wrap.combo-has-options .combo-input{ padding-right:30px; }

.combo-wrap.combo-has-options::after{
  content:"▾"; position:absolute; right:10px; top:50%; transform:translateY(-50%);
  color:var(--steel); font-size:13px; pointer-events:none;
}

.combo-wrap.combo-open .combo-input{ border-color:var(--steel); border-bottom-left-radius:0; border-bottom-right-radius:0; }

.combo-dropdown{
  display:none; position:absolute; top:100%; left:0; right:0; z-index:50;
  background:var(--paper); border:1px solid var(--steel); border-top:none;
  border-radius:0 0 8px 8px; max-height:240px; overflow-y:auto;
  box-shadow:0 8px 20px rgba(27,35,43,0.15);
}

.combo-wrap.combo-open .combo-dropdown{ display:block; }

.combo-option{
  padding:10px 12px; font-size:14px; color:var(--ink); cursor:pointer; border-bottom:1px solid var(--line);
}

.combo-option:last-child{ border-bottom:none; }

.combo-option:hover, .combo-option:active{ background:var(--steel-soft); color:var(--steel); }

.combo-empty{ padding:10px 12px; font-size:12.5px; color:var(--ink-faint); font-style:italic; }


.form-actions{ display:flex; gap:10px; margin-top:14px; }

/* ---------- assignment cards ---------- */

.card-list{ display:flex; flex-direction:column; gap:14px; }

.dienstreise-card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden;
}

.card-header{
  display:flex; align-items:center; gap:14px; padding:14px 16px; cursor:pointer;
}

.card-header:hover{ background:#fafaf8; }

.seq-badge{
  flex:none; width:30px; height:30px; border-radius:6px; background:var(--steel-soft);
  color:var(--steel); display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700;
}

.card-heading{ flex:1 1 auto; min-width:120px; }

.card-place{ font-weight:700; font-size:15.5px; }

.card-customer{ font-size:12.5px; color:var(--orange); font-weight:600; margin-top:1px; }

.card-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

.card-totals{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

.chip{
  font-size:11.5px; padding:4px 9px; border-radius:20px; background:var(--bg); color:var(--ink-soft);
  white-space:nowrap;
}

.chip b{ color:var(--ink); font-weight:600; }

.chip-travel{ background:var(--steel-soft); color:var(--steel); }

.chip-travel b{ color:var(--steel); }

.chip-work{ background:var(--orange-soft); color:#8a3c08; }

.chip-work b{ color:#8a3c08; }

.chip-expense{ background:var(--green-soft); color:var(--green); }

.chip-expense b{ color:var(--green); }

.chevron-btn{
  flex:none; width:28px; height:28px; border-radius:50%; border:1px solid var(--line);
  background:var(--paper); font-size:16px; line-height:1; color:var(--ink-soft);
}

.card-body{ border-top:1px solid var(--line); padding:14px 16px 16px; }

.assignment-note{
  font-size:13px; color:var(--ink-soft); font-style:italic; margin-bottom:10px;
}

.rate-info-bar{
  display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft);
  background:var(--bg); border-radius:6px; padding:8px 12px; margin-bottom:10px;
}

.rate-info-bar b{ color:var(--ink); }

/* ---------- day rows ---------- */

.day-row{
  display:grid; grid-template-columns:88px 1fr 1fr 82px 1.5fr 60px;
  gap:8px 12px; align-items:center; padding:9px 4px; border-bottom:1px solid var(--line);
}

.day-row:last-child{ border-bottom:none; }

.day-row-header{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);
  font-weight:600; padding-bottom:8px; border-bottom:1px solid var(--ink);
}

.d-field{ display:flex; flex-direction:column; gap:2px; min-width:0; }

.d-field .field-label{ display:none; }

.d-hours{ font-size:11.5px; font-weight:600; }

.travel-color{ color:var(--steel); }

.work-color{ color:#8a3c08; }

.d-empty{ color:var(--ink-faint); }

.meal-icons{ font-size:11px; margin-left:4px; letter-spacing:1px; }

.d-pause-note{ display:block; font-size:10px; color:var(--ink-faint); margin-top:1px; }

.day-row-total{
  font-weight:700; background:var(--bg); border-radius:6px; border-top:2px solid var(--ink);
  margin-top:2px; padding-top:11px;
}

/* ---------- Verpflegungsrechner ---------- */

.verpflegung-calc{
  background:var(--bg); border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; gap:8px;
}

.verpflegung-calc-label{ font-size:12px; font-weight:600; color:var(--ink-soft); }

.verpflegung-checks{ display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--ink); }

.verpflegung-checks label{ display:flex; align-items:center; gap:6px; cursor:pointer; }

.verpflegung-checks input{ width:15px; height:15px; margin:0; }

/* ---------- Wochenübersicht ---------- */

.week-summary{ margin-bottom:22px; }

.week-table{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden;
}

.week-row{
  display:grid; grid-template-columns:70px 1fr 90px 90px 90px; gap:8px; align-items:center;
  padding:8px 14px; border-bottom:1px solid var(--line); font-size:13px;
}

.week-row:last-child{ border-bottom:none; }

.week-row-header{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);
  font-weight:600; background:var(--bg);
}

.week-range{ color:var(--ink-soft); }

.week-soll{ color:var(--ink-faint); }

.week-diff-pos{ color:var(--green); font-weight:600; }

.week-diff-neg{ color:var(--red); font-weight:600; }

/* ---------- Kalender ---------- */

.calendar-section{ margin-bottom:22px; }

.calendar-section h2{ margin:0 0 12px; font-size:16px; font-weight:700; }

.calendar-header{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }

.calendar-month-label{ font-weight:700; font-size:15px; flex:1; text-align:center; }

.calendar-legend{
  display:flex; flex-wrap:wrap; gap:8px 14px; font-size:11px; color:var(--ink-soft);
  margin:0 0 10px;
}

.calendar-legend span{ display:flex; align-items:center; }

.calendar-grid{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:10px; box-shadow:var(--shadow); }

.cal-week-row{ display:grid; grid-template-columns:26px repeat(7, 1fr); gap:4px; margin-bottom:4px; }

.cal-week-row-header{
  font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint);
  text-align:center; margin-bottom:6px;
}

.cal-kw{ display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--ink-faint); }

.cal-day{
  aspect-ratio:1; border:none; border-radius:6px; background:var(--bg);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink); padding:0;
}

.cal-day:hover{ filter:brightness(0.96); }

.cal-day-outside{ opacity:.32; }

.cal-day-today{ box-shadow:inset 0 0 0 2px var(--ink); font-weight:700; }

.cal-day-selected{ box-shadow:inset 0 0 0 2px var(--focus); }

.cal-tone-dienstreise{ background:var(--steel); color:#fff; }

.cal-tone-holiday{ background:var(--orange-soft); color:#8a3c08; }

.cal-tone-weekend{ background:#eef1f3; }

.cal-tone-urlaub{ background:var(--urlaub); color:#fff; }

.cal-tone-krankheit{ background:var(--red); color:#fff; }

.cal-tone-sonderurlaub{ background:var(--sonderurlaub); color:#fff; }

/* Tageszelle innerhalb der Auswahl kann mehrere tone-Klassen erben; letzte gewinnt per CSS-Reihenfolge oben. */

.daypanel{
  background:var(--paper); border:1px solid var(--line); border-radius:8px;
  padding:12px 14px; margin-top:10px;
}

.daypanel-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }

.daypanel-line{ font-size:13px; margin-bottom:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

.daypanel-muted{ color:var(--ink-faint); }

.abwesenheiten-list{ margin-top:14px; }

.abwesenheiten-list-title{ font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:8px; }

.abwesenheit-row{
  display:flex; align-items:center; gap:10px; padding:7px 2px; border-bottom:1px solid var(--line);
  font-size:13px; flex-wrap:wrap;
}

.abwesenheit-row:last-child{ border-bottom:none; }

.abwesenheit-typ-badge{ font-size:10.5px; font-weight:600; padding:2px 9px; border-radius:10px; color:#fff; white-space:nowrap; }

.abwesenheit-typ-urlaub{ background:var(--urlaub); }

.abwesenheit-typ-krankheit{ background:var(--red); }

.abwesenheit-typ-sonderurlaub{ background:var(--sonderurlaub); }

.abwesenheit-notiz{ color:var(--ink-soft); flex:1; min-width:80px; }

.d-notiz{
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px;
}

.d-field-notiz{ min-width:0; }

.d-actions{ display:flex; gap:6px; justify-content:flex-end; }

.icon-btn{
  width:26px; height:26px; border-radius:6px; border:1px solid var(--line); background:var(--paper);
  font-size:12px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
}

.icon-btn:hover{ border-color:var(--ink-soft); }

.icon-btn.danger:hover{ border-color:var(--red); color:var(--red); background:var(--red-soft); }

.empty-days{ padding:16px 4px; color:var(--ink-faint); font-size:13px; }

.day-legend{ font-size:10.5px; color:var(--ink-faint); margin:2px 0 8px; }

.legend-dot{
  display:inline-block; width:9px; height:9px; border-radius:2px; vertical-align:middle;
  margin:0 8px 0 3px;
}

.legend-weekend{ background:#eef1f3; border:1px solid var(--line); }

.legend-holiday{ background:var(--orange-soft); border:1px solid var(--orange); }

.day-row-weekend{ background:#f5f7f8; border-radius:6px; }

.day-row-holiday{ background:var(--orange-soft); border-radius:6px; }

.d-weekday{ color:var(--ink-faint); font-weight:700; margin-right:3px; }

.day-row-weekend .d-weekday{ color:var(--steel); }

.day-row-holiday .d-weekday{ color:#8a3c08; }

.holiday-badge{
  display:inline-block; width:fit-content; margin-top:3px; font-size:9.5px; font-weight:600;
  text-transform:uppercase; letter-spacing:.05em; background:var(--orange); color:#fff;
  padding:1px 7px; border-radius:10px;
}

.day-edit-form.day-row{
  display:flex; flex-wrap:wrap; gap:10px 14px; background:var(--bg); border-radius:8px;
  padding:12px; margin:6px 0; border-bottom:none;
}

.day-edit-form .field{ flex:1 1 120px; }

.day-edit-form .field-wide{ flex:1 1 100%; }

.day-edit-form .form-actions{ flex:1 1 100%; margin-top:2px; }

/* ---------- time select (Stunde/Minute, harte Grenzen) ---------- */

.time-select-group{ display:flex; align-items:center; gap:4px; }

.time-select{
  border:1px solid var(--line); border-radius:6px; padding:8px 6px; font-size:14px;
  background:var(--bg); color:var(--ink); font-family:'IBM Plex Mono', monospace;
}

.time-select:focus{ background:var(--paper); border-color:var(--steel); }

.time-sep{ color:var(--ink-faint); font-weight:600; }

/* ---------- Reisezeit-Umschalter (Anreise/Abreise) ---------- */

.reise-toggle-wrap{
  background:var(--bg); border-radius:8px; padding:10px 12px;
  display:flex; align-items:center; flex-wrap:wrap; gap:8px 10px;
}

.reise-toggle-checkbox{ width:16px; height:16px; margin:0; flex:none; }

.reise-toggle-label{

<body>
<div id="app"></div>
<script>
/* ===================== Dienstreise-Stundenzettel ===================== */

let state = { assignments: [], abwesenheiten: [], updatedAt: 0, settings: { urlaubstage: 30, sollWochenstunden: 40 } };
let ui = {
  expanded: new Set(),
  showAddAssignment: false,
  editingAssignmentId: null,
  addingDayFor: null,
  editingDayId: null,
  lastDate: null,
  localSaveError: false,
  errorPopup: null,
  showAllWeeks: false,
  showSyncSettings: false,
  syncStatus: 'idle',
  syncError: null,
  calendarMonth: null,
  selectedCalDay: null,
  showAddAbwesenheit: false,
  editingAbwesenheitId: null,
  printSingleId: null
};
let loaded = false;

/* ----------------------- helpers: id / esc ----------------------- */

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ----------------------- error popup ----------------------- */

function queueError(title, message, kind) {
  ui.errorPopup = { title, message, kind: kind || 'error' };
}

function showError(title, message) {
  queueError(title, message, 'error');
  render();
}

function showInfo(title, message) {
  queueError(title, message, 'info');
  render();
}

function renderErrorPopup() {
  if (!ui.errorPopup) return '';
  const isInfo = ui.errorPopup.kind === 'info';
  const icon = isInfo ? '✅' : '⚠️';
  return `
    <div class="popup-backdrop no-print" data-action="close-error-popup">
      <div class="popup-box ${isInfo ? 'popup-box-info' : ''}" role="alertdialog" aria-modal="true" aria-labelledby="popup-title" onclick="event.stopPropagation()">
        <div class="popup-title" id="popup-title">${icon} ${esc(ui.errorPopup.title)}</div>
        <div class="popup-message">${esc(ui.errorPopup.message)}</div>
        <div class="form-actions">
          <button type="button" class="btn btn-primary" data-action="close-error-popup">Verstanden</button>
        </div>
      </div>
    </div>`;
}

/* ----------------------- helpers: dates/times ----------------------- */

function pad(n) { return n.toString().padStart(2, '0'); }
function pad2(n) { return n.toString().padStart(2, '0'); }

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function fmtDateDE(iso) {
  if (!iso) return '—';
  const parts = iso.split('-');
  if (parts.length !== 3) return iso;
  const [y, m, d] = parts;
  return `${d}.${m}.${y}`;
}

function addDaysISO(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function daysBetweenInclusive(startIso, endIso) {
  const s = new Date(startIso + 'T00:00:00');
  const e = new Date(endIso + 'T00:00:00');
  return Math.round((e - s) / 86400000) + 1;
}

function timeToMinutes(t) {
  if (!t) return null;
  const bits = t.split(':');
  if (bits.length < 2) return null;
  const h = Number(bits[0]), m = Number(bits[1]);
  if (Number.isNaN(h) || Number.isNaN(m)) return null;
  return h * 60 + m;
}

function durationHours(start, end) {
  const s = timeToMinutes(start);
  const e = timeToMinutes(end);
  if (s === null || e === null) return 0;
  let diff = e - s;
  if (diff < 0) diff += 24 * 60;
  return Math.round((diff / 60) * 100) / 100;
}

/* ----------------------- Zeit-Dropdowns (Stunde/Minute, harte Grenzen) ----------------------- */

function timeSelectHTML(name, value) {
  const parts = (value || '').split(':');
  const vh = parts[0] || '';
  const vm = parts[1] || '';
  let hOpts = '<option value="">--</option>';
  for (let h = 0; h < 24; h++) {
    const hh = pad2(h);
    hOpts += `<option value="${hh}"${vh === hh ? ' selected' : ''}>${hh}</option>`;
  }
  let mOpts = '<option value="">--</option>';
  for (let m = 0; m < 60; m++) {
    const mm = pad2(m);
    mOpts += `<option value="${mm}"${vm === mm ? ' selected' : ''}>${mm}</option>`;
  }
  return `<div class="time-select-group">
      <select name="${name}_h" class="time-select" aria-label="Stunde">${hOpts}</select>
      <span class="time-sep">:</span>
      <select name="${name}_m" class="time-select" aria-label="Minute">${mOpts}</select>
    </div>`;
}

function combineTimeFromForm(fd, name) {
  const h = (fd.get(name + '_h') || '').toString();
  const m = (fd.get(name + '_m') || '').toString();
  if (!h || !m) return '';
  return `${h}:${m}`;
}

function isEdgeDay(a, dateISO) {
  if (!dateISO) return false;
  return dateISO === a.start || (a.ende && dateISO === a.ende);
}

/* ----------------------- Länder-Tagessätze (externe JSON-Datei, pro Jahr) ----------------------- */

let countryRatesByYear = null; // { "2026": { quelle, vollstaendig, saetze: { "Spanien": 41, ... } }, "2025": {...} }

async function loadLaenderSaetze() {
  try {
    const res = await fetch('./laendersaetze.json');
    if (!res.ok) return;
    const data = await res.json();
    if (data && data.jahre && typeof data.jahre === 'object') {
      countryRatesByYear = data.jahre;
    }
  } catch (e) {
    // Datei nicht erreichbar (z.B. als Einzeldatei/innerhalb von Claude geöffnet) - kein Problem,
    // Tagessatz bleibt dann einfach manuell einzutragen.
  }
}

function latestRatesYear() {
  if (!countryRatesByYear) return null;
  const years = Object.keys(countryRatesByYear).map(Number).filter(n => !Number.isNaN(n));
  return years.length ? Math.max(...years) : null;
}

// Gibt den Tagessatz NUR zurück, wenn er exakt für dieses Jahr vorliegt - fällt bewusst
// NICHT auf ein anderes Jahr zurück, damit alte Dienstreisen nicht mit einem falschen
// (z.B. neueren) Satz vorbefüllt werden.
function lookupLaenderSatz(land, ort, year) {
  if (!countryRatesByYear || !land || !year) return null;
  const yearData = countryRatesByYear[String(year)];
  if (!yearData || !yearData.saetze) return null;
  const landTrim = land.trim();
  let landEntry = yearData.saetze[landTrim];
  if (!landEntry) {
    const lowerLand = landTrim.toLowerCase();
    const key = Object.keys(yearData.saetze).find(k => k.toLowerCase() === lowerLand);
    if (key) landEntry = yearData.saetze[key];
  }
  if (!landEntry) return null;

  const ortTrim = (ort || '').trim();
  if (ortTrim && landEntry.orte) {
    if (landEntry.orte[ortTrim] !== undefined) return landEntry.orte[ortTrim];
    const lowerOrt = ortTrim.toLowerCase();
    const ortKey = Object.keys(landEntry.orte).find(k => k.toLowerCase() === lowerOrt);
    if (ortKey) return landEntry.orte[ortKey];
  }
  return landEntry.default || null;
}

function laenderTabelleVeraltet() {
  const latest = latestRatesYear();
  if (!latest) return false;
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  if (year > latest) return true;
  if (year === latest && month >= 12) return true; // BMF veröffentlicht i.d.R. Anfang Dezember fürs Folgejahr
  return false;
}


/* ----------------------- Verpflegungsmehraufwand (§9 Abs. 4a EStG) ----------------------- */

function verpflegungBetrag(tagessatz, isEdge, fruehstueck, mittag, abend, isGerman) {
  const satz = Number(tagessatz) || 0;
  if (satz <= 0) return 0;
  let betrag;
  if (isGerman) {
    // Inlandspauschale (§9 Abs. 4a EStG): fester Betrag, KEINE ⅔-Regel wie im Ausland.
    // 28€ voller Kalendertag, 14€ An-/Abreisetag bzw. Tage mit >8h Abwesenheit. Unverändert seit 2020.
    betrag = isEdge ? 14 : 28;
  } else {
    // An-/Abreisetag = 2/3 des vollen Tagessatzes, auf volle Euro gerundet
    // (verifiziert gegen die offizielle BMF-Auslandstagegeld-Tabelle: 104/105 Länder stimmen exakt).
    betrag = isEdge ? Math.round(satz * 2 / 3) : satz;
  }
  const kuerzungsBasis = isGerman ? 28 : satz;
  if (fruehstueck) betrag -= kuerzungsBasis * 0.2;
  if (mittag) betrag -= kuerzungsBasis * 0.4;
  if (abend) betrag -= kuerzungsBasis * 0.4;
  return Math.max(Math.round(betrag * 100) / 100, 0);
}

// Legt für jeden Kalendertag im Bereich [vonDatum, bisDatum] einen Tageseintrag an
// (durchgängige Verpflegungspauschale, §9 Abs. 4a EStG) - Arbeitszeit nur an den in
// activeWeekdays (Set von 0=So..6=Sa) enthaltenen Wochentagen. Überspringt bereits
// vorhandene Daten. Gibt { created, skipped } zurück.
function generateDaysForRange(a, vonDatum, bisDatum, activeWeekdays, arbeitStart, arbeitEnde, manualSpesen, fruehstueck, mittag, abend, notiz) {
  if (!a.tage) a.tage = [];
  const existingDates = new Set(a.tage.map(d => d.datum));
  const hasTagessatz = a.tagessatz > 0;
  let created = 0, skipped = 0;
  let cur = vonDatum;
  let guard = 0;
  while (cur <= bisDatum && guard < 2000) {
    const dow = new Date(cur + 'T00:00:00').getDay();
    const isWorkDay = activeWeekdays.has(dow) && !!arbeitStart && !!arbeitEnde;
    if (existingDates.has(cur)) {
      skipped++;
    } else {
      const tagSpesen = hasTagessatz
        ? verpflegungBetrag(a.tagessatz, isEdgeDay(a, cur), fruehstueck, mittag, abend, isGermanAssignment(a))
        : manualSpesen;
      a.tage.push({
        id: uid(), datum: cur, reiseStart: '', reiseEnde: '',
        arbeitStart: isWorkDay ? arbeitStart : '',
        arbeitEnde: isWorkDay ? arbeitEnde : '',
        frei: !isWorkDay,
        spesen: tagSpesen, fruehstueck, mittag, abend, notiz
      });
      existingDates.add(cur);
      created++;
    }
    cur = addDaysISO(cur, 1);
    guard++;
  }
  return { created, skipped };
}

function fmtHours(h) {
  return (h || 0).toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 2 }) + ' h';
}

function fmtEuro(v) {
  return (v || 0).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}

function numDE(n) {
  return (Math.round((n || 0) * 100) / 100).toFixed(2).replace('.', ',');
}

/* ----------------------- derived calculations ----------------------- */

function dayReise(d) { return durationHours(d.reiseStart, d.reiseEnde); }

function pauseMinutesForDuration(hoursRaw) {
  if (hoursRaw > 9) return 45;
  if (hoursRaw > 6) return 30;
  return 0;
}

function dayArbeitRaw(d) { return durationHours(d.arbeitStart, d.arbeitEnde); }

function dayArbeitPauseMin(d) { return pauseMinutesForDuration(dayArbeitRaw(d)); }

function dayArbeit(d) {
  const raw = dayArbeitRaw(d);
  const pause = pauseMinutesForDuration(raw) / 60;
  return Math.round(Math.max(raw - pause, 0) * 100) / 100;
}

function assignmentTotals(a) {
  let reise = 0, arbeit = 0, spesen = 0;
  (a.tage || []).forEach(d => {
    reise += dayReise(d);
    arbeit += dayArbeit(d);
    spesen += Number(d.spesen) || 0;
  });
  return {
    reise: Math.round(reise * 100) / 100,
    arbeit: Math.round(arbeit * 100) / 100,
    spesen: Math.round(spesen * 100) / 100,
    tage: (a.tage || []).length
  };
}

function grandTotals() {
  let reise = 0, arbeit = 0, spesen = 0;
  state.assignments.forEach(a => {
    const t = assignmentTotals(a);
    reise += t.reise; arbeit += t.arbeit; spesen += t.spesen;
  });
  return {
    reise: Math.round(reise * 100) / 100,
    arbeit: Math.round(arbeit * 100) / 100,
    spesen: Math.round(spesen * 100) / 100,
    einsaetze: state.assignments.length
  };
}

function sortedAsc() {
  return [...state.assignments].sort((a, b) => (a.start || '').localeCompare(b.start || ''));
}

function placeLabel(a) {
  return a.ort ? `${a.ort}, ${a.land}` : (a.land || 'Unbenannt');
}

/* ----------------------- autocomplete lists ----------------------- */

function allKnownLaender() {
  const names = new Set(['Deutschland']);
  state.assignments.forEach(a => { if ((a.land || '').trim()) names.add(a.land.trim()); });
  if (countryRatesByYear) {
    Object.values(countryRatesByYear).forEach(yearData => {
      if (yearData && yearData.saetze) Object.keys(yearData.saetze).forEach(l => names.add(l));
    });
  }
  return [...names].sort((a, b) => a.localeCompare(b, 'de'));
}

function allKnownOrteForLand(land) {
  const names = new Set(
    state.assignments.filter(a => (a.land || '').trim().toLowerCase() === (land || '').trim().toLowerCase())
      .map(a => (a.ort || '').trim()).filter(Boolean)
  );
  if (countryRatesByYear && land) {
    const lowerLand = land.trim().toLowerCase();
    Object.values(countryRatesByYear).forEach(yearData => {
      if (!yearData || !yearData.saetze) return;
      const key = Object.keys(yearData.saetze).find(k => k.toLowerCase() === lowerLand);
      const entry = key ? yearData.saetze[key] : null;
      if (entry && entry.orte) Object.keys(entry.orte).forEach(o => names.add(o));
    });
  }
  return [...names].sort((a, b) => a.localeCompare(b, 'de'));
}

function uniqueKundeList() {
  return [...new Set(state.assignments.map(a => (a.kunde || '').trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'de'));
}

function renderKundeDatalist(idSuffix) {
  const opts = uniqueKundeList().map(k => `<option value="${esc(k)}">`).join('');
  return `<datalist id="kunde-list-${idSuffix}">${opts}</datalist>`;
}

/* ----------------------- durchsuchbares Dropdown (Land/Ort) ----------------------- */

function comboFieldHTML(name, value, placeholder, source, required, hasOptions) {
  return `
    <div class="combo-wrap ${hasOptions ? 'combo-has-options' : ''}" role="combobox" aria-expanded="false">
      <input type="text" name="${name}" class="combo-input" autocomplete="off" ${required ? 'required' : ''}
        placeholder="${esc(placeholder)}" value="${esc(value || '')}" data-combo-source="${source}">
      <div class="combo-dropdown" role="listbox"></div>
    </div>`;
}

function getComboSource(input) {
  const source = input.dataset.comboSource;
  if (source === 'land') return allKnownLaender();
  if (source === 'ort') {
    const form = input.closest('form');
    const landInput = form ? form.querySelector('input[name="land"]') : null;
    return allKnownOrteForLand(landInput ? landInput.value : '');
  }
  return [];
}

function renderComboOptions(input) {
  const wrap = input.closest('.combo-wrap');
  const dropdown = wrap && wrap.querySelector('.combo-dropdown');
  if (!wrap || !dropdown) return;
  const all = getComboSource(input);
  const filter = input.value.trim().toLowerCase();
  const filtered = filter ? all.filter(s => s.toLowerCase().includes(filter)) : all;
  if (all.length === 0) {
    dropdown.innerHTML = '';
    closeCombo(wrap);
    return;
  }
  dropdown.innerHTML = filtered.length
    ? filtered.slice(0, 200).map(s => `<div class="combo-option" role="option" data-value="${esc(s)}">${esc(s)}</div>`).join('')
    : '<div class="combo-empty">Keine Treffer – wird als Freitext übernommen</div>';
  wrap.classList.add('combo-open');
  wrap.setAttribute('aria-expanded', 'true');
}

function closeCombo(wrap) {
  if (!wrap) return;
  wrap.classList.remove('combo-open');
  wrap.setAttribute('aria-expanded', 'false');
}

function closeAllCombos() {
  document.querySelectorAll('.combo-wrap.combo-open').forEach(closeCombo);
}

function selectComboOption(optionEl) {
  const wrap = optionEl.closest('.combo-wrap');
  const input = wrap.querySelector('.combo-input');
  input.value = optionEl.getAttribute('data-value');
  closeCombo(wrap);
  input.dispatchEvent(new Event('change', { bubbles: true }));
}

/* ----------------------- weekday / weekend / feiertage ----------------------- */

const WEEKDAY_ABBR = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

function weekdayAbbr(dateISO) {
  const d = new Date(dateISO + 'T00:00:00');
  return WEEKDAY_ABBR[d.getDay()];
}

function isWeekendISO(dateISO) {
  const d = new Date(dateISO + 'T00:00:00');
  const day = d.getDay();
  return day === 0 || day === 6;
}

function isGermanAssignment(a) {
  const l = (a.land || '').trim().toLowerCase();
  return l === 'deutschland' || l === 'germany' || l === 'de' || l === 'brd';
}

const holidayCache = {};

function easterSundayISO(year) {
  // Gauss'sche Osterformel
  const a = year % 19;
  const b = Math.floor(year / 100);
  const c = year % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const monthDay = h + l - 7 * m + 114;
  const month = Math.floor(monthDay / 31);
  const day = (monthDay % 31) + 1;
  return `${year}-${pad(month)}-${pad(day)}`;
}

function germanHolidaysForYear(year) {
  if (holidayCache[year]) return holidayCache[year];
  const easter = easterSundayISO(year);
  const map = new Map([
    [`${year}-01-01`, 'Neujahr'],
    [addDaysISO(easter, -2), 'Karfreitag'],
    [addDaysISO(easter, 1), 'Ostermontag'],
    [`${year}-05-01`, 'Tag der Arbeit'],
    [addDaysISO(easter, 39), 'Christi Himmelfahrt'],
    [addDaysISO(easter, 50), 'Pfingstmontag'],
    [`${year}-10-03`, 'Tag der Deutschen Einheit'],
    [`${year}-12-25`, '1. Weihnachtstag'],
    [`${year}-12-26`, '2. Weihnachtstag']
  ]);
  holidayCache[year] = map;
  return map;
}

function germanHolidayName(dateISO) {
  const year = Number(dateISO.slice(0, 4));
  if (!year) return null;
  return germanHolidaysForYear(year).get(dateISO) || null;
}

/* ----------------------- Jahresübersicht ----------------------- */

function countWeekdaysBetween(startISO, endISO) {
  if (!startISO || !endISO || startISO > endISO) return 0;
  let count = 0;
  let cur = startISO;
  let guard = 0;
  while (cur <= endISO && guard < 20000) {
    if (!isWeekendISO(cur)) count++;
    cur = addDaysISO(cur, 1);
    guard++;
  }
  return count;
}

function germanHolidayWeekdayCount(year) {
  let count = 0;
  germanHolidaysForYear(year).forEach((name, dateISO) => {
    if (!isWeekendISO(dateISO)) count++;
  });
  return count;
}

function getUrlaubstage() {
  return (state.settings && typeof state.settings.urlaubstage === 'number') ? state.settings.urlaubstage : 30;
}

function maxWorkingDays(year) {
  const base = 5 * 4 * 12; // 240
  const feiertage = germanHolidayWeekdayCount(year);
  const urlaub = getUrlaubstage();
  return Math.max(base - feiertage - urlaub, 0);
}

function assignmentEffectiveEnd(a) {
  const today = todayISO();
  return a.ende || (a.start <= today ? today : a.start);
}

/* ----------------------- Kalender ----------------------- */

const ABWESENHEIT_LABELS = { urlaub: 'Urlaub', krankheit: 'Krankheit', sonderurlaub: 'Sonderurlaub' };

function currentYearMonth() { return todayISO().slice(0, 7); }

function shiftYearMonth(yearMonth, delta) {
  const [y, m] = yearMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}

function getMonthGrid(yearMonth) {
  const [y, m] = yearMonth.split('-').map(Number);
  const firstOfMonth = `${y}-${pad(m)}-01`;
  const firstWeekday = new Date(firstOfMonth + 'T00:00:00').getDay(); // 0=So..6=Sa
  const leadDays = firstWeekday === 0 ? 6 : firstWeekday - 1; // Woche beginnt Montag
  let cur = addDaysISO(firstOfMonth, -leadDays);
  const weeks = [];
  for (let w = 0; w < 6; w++) {
    const week = [];
    for (let d = 0; d < 7; d++) { week.push(cur); cur = addDaysISO(cur, 1); }
    weeks.push(week);
  }
  return weeks;
}

function abwesenheitOnDay(dateISO) {
  return (state.abwesenheiten || []).find(x => x.start <= dateISO && dateISO <= (x.ende || x.start)) || null;
}

function assignmentsOnDay(dateISO) {
  return state.assignments.filter(a => a.start && a.start <= dateISO && dateISO <= assignmentEffectiveEnd(a));
}

function getDayInfo(dateISO) {
  return {
    holiday: germanHolidayName(dateISO),
    weekend: isWeekendISO(dateISO),
    dienstreisen: assignmentsOnDay(dateISO),
    abwesenheit: abwesenheitOnDay(dateISO)
  };
}

function yearsTouched() {
  const years = new Set();
  state.assignments.forEach(a => {
    if (!a.start) return;
    const end = assignmentEffectiveEnd(a);
    const startYear = Number(a.start.slice(0, 4));
    const endYear = Number(end.slice(0, 4));
    if (!startYear || !endYear) return;
    for (let y = startYear; y <= endYear; y++) years.add(y);
  });
  return [...years].sort((a, b) => b - a);
}

function yearStats(year) {
  const yearStart = `${year}-01-01`;
  const yearEnd = `${year}-12-31`;
  let einsaetze = 0;
  let tageUnterwegs = 0;
  let arbeitH = 0, reiseH = 0, spesen = 0;
  state.assignments.forEach(a => {
    if (!a.start) return;
    const end = assignmentEffectiveEnd(a);
    const overlapStart = a.start > yearStart ? a.start : yearStart;
    const overlapEnd = end < yearEnd ? end : yearEnd;
    if (overlapStart > overlapEnd) return;
    einsaetze++;
    tageUnterwegs += countWeekdaysBetween(overlapStart, overlapEnd);
    (a.tage || []).forEach(d => {
      if (d.datum && d.datum >= yearStart && d.datum <= yearEnd) {
        arbeitH += dayArbeit(d);
        reiseH += dayReise(d);
        spesen += Number(d.spesen) || 0;
      }
    });
  });
  return {
    year, einsaetze, tageUnterwegs,
    maxTage: maxWorkingDays(year),
    arbeitH: Math.round(arbeitH * 100) / 100,
    reiseH: Math.round(reiseH * 100) / 100,
    spesen: Math.round(spesen * 100) / 100
  };
}

/* ----------------------- Wochenübersicht ----------------------- */

function getMondayISO(dateISO) {
  const d = new Date(dateISO + 'T00:00:00');
  const day = d.getDay(); // 0=So..6=Sa
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function getISOWeekNumber(dateISO) {
  const d = new Date(dateISO + 'T00:00:00');
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  const yearStart = new Date(d.getFullYear(), 0, 1);
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
}

function getSollWochenstunden() {
  return (state.settings && typeof state.settings.sollWochenstunden === 'number') ? state.settings.sollWochenstunden : 40;
}

function weeklyStats() {
  const weeks = new Map();
  state.assignments.forEach(a => {
    (a.tage || []).forEach(d => {
      if (!d.datum) return;
      const monday = getMondayISO(d.datum);
      if (!weeks.has(monday)) weeks.set(monday, { arbeitH: 0, reiseH: 0 });
      const w = weeks.get(monday);
      w.arbeitH += dayArbeit(d);
      w.reiseH += dayReise(d);
    });
  });
  return [...weeks.entries()]
    .map(([monday, v]) => ({
      monday,
      sonntag: addDaysISO(monday, 6),
      kw: getISOWeekNumber(monday),
      arbeitH: Math.round(v.arbeitH * 100) / 100,
      reiseH: Math.round(v.reiseH * 100) / 100
    }))
    .sort((a, b) => b.monday.localeCompare(a.monday));
}

/* ----------------------- persistence: local (browser) ----------------------- */

const LOCAL_KEY = 'dienstreise-stundenzettel-local-v1';
const OLD_CLAUDE_STORAGE_KEY = 'montage-stundenzettel-data-v1'; // ganz frühere Version, für einmalige Migration

let storageBackend = 'memory'; // 'claude' | 'local' | 'memory'
const memoryStore = {};

async function detectStorageBackend() {
  if (typeof window.storage !== 'undefined' && window.storage
      && typeof window.storage.get === 'function' && typeof window.storage.set === 'function') {
    return 'claude';
  }
  try {
    const testKey = '__dienstreise_storage_test__';
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
    return 'local';
  } catch (e) {
    return 'memory';
  }
}

async function storageGet(key) {
  if (storageBackend === 'claude') {
    try {
      const res = await window.storage.get(key, false);
      return res && res.value ? res.value : null;
    } catch (e) { return null; }
  }
  if (storageBackend === 'local') {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null;
}

async function storageSet(key, value) {
  if (storageBackend === 'claude') {
    try { await window.storage.set(key, value, false); return true; } catch (e) { return false; }
  }
  if (storageBackend === 'local') {
    try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; }
  }
  memoryStore[key] = value;
  return true;
}

let lastPersistOk = true;

async function persist() {
  state.updatedAt = Date.now();
  const ok = await storageSet(LOCAL_KEY, JSON.stringify(state));
  ui.localSaveError = !ok;
  ui.syncStatus = 'idle';
  ui.syncError = null;
  if (!ok && lastPersistOk) {
    showError('Speichern fehlgeschlagen',
      'Deine letzte Änderung konnte nicht dauerhaft gespeichert werden. Sie bleibt für diese Sitzung sichtbar, geht aber beim Schließen verloren. Bitte exportiere zur Sicherheit eine Sicherung (unten in der Fußzeile).');
  }
  lastPersistOk = ok;
  if (ok) scheduleAutoSync();
}

let autoSyncTimer = null;
const AUTO_SYNC_DELAY_MS = 1500; // kurze Pause, damit mehrere schnelle Änderungen (z.B. Serienerfassung) gebündelt werden

function scheduleAutoSync() {
  const cfg = getSyncConfig();
  if (!cfg) return; // kein Cloud-Sync eingerichtet -> nichts zu tun, keine ungefragten Panels öffnen
  clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(() => {
    if (ui.syncStatus === 'running') {
      // Es läuft gerade schon ein Sync (z.B. von einer vorherigen schnellen Änderung) - kurz später erneut versuchen.
      scheduleAutoSync();
      return;
    }
    doSync(true);
  }, AUTO_SYNC_DELAY_MS);
}

/* ----------------------- Cloud-Sync (jsonbin.io, pro Person ein eigenes Konto) ----------------------- */

const SYNC_CONFIG_KEY = 'dienstreise-stundenzettel-sync-v1';
const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b';

function getSyncConfig() {
  try {
    const raw = localStorage.getItem(SYNC_CONFIG_KEY);
    if (!raw) return null;
    const cfg = JSON.parse(raw);
    return cfg && cfg.apiKey ? cfg : null;
  } catch (e) {
    return null;
  }
}

function setSyncConfig(cfg) {
  try { localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg)); } catch (e) { /* ignore */ }
}

function clearSyncConfig() {
  try { localStorage.removeItem(SYNC_CONFIG_KEY); } catch (e) { /* ignore */ }
}

function hasPendingChanges() {
  const cfg = getSyncConfig();
  if (!cfg || !cfg.binId) return false;
  return (state.updatedAt || 0) > (cfg.lastSyncedAt || 0);
}

async function jsonbinCreate(apiKey, data) {
  const res = await fetch(JSONBIN_BASE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': apiKey, 'X-Bin-Name': 'dienstreise-stundenzettel' },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(`Anlegen fehlgeschlagen (Status ${res.status}). Master-Key prüfen.`);
  const json = await res.json();
  if (!json || !json.metadata || !json.metadata.id) throw new Error('Unerwartete Antwort beim Anlegen.');
  return json.metadata.id;
}

async function jsonbinRead(apiKey, binId) {
  const res = await fetch(`${JSONBIN_BASE}/${binId}/latest`, { method: 'GET', headers: { 'X-Master-Key': apiKey } });
  if (!res.ok) throw new Error(`Lesen fehlgeschlagen (Status ${res.status}). Master-Key/Bin-ID prüfen.`);
  const json = await res.json();
  return json && json.record ? json.record : null;
}

async function jsonbinUpdate(apiKey, binId, data) {
  const res = await fetch(`${JSONBIN_BASE}/${binId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Master-Key': apiKey },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(`Speichern fehlgeschlagen (Status ${res.status}).`);
}

async function doSync(silent) {
  const cfg = getSyncConfig();
  if (!cfg) {
    if (!silent) {
      ui.showSyncSettings = true;
      render();
    }
    return;
  }
  ui.syncStatus = 'running';
  ui.syncError = null;
  render();
  try {
    let binId = cfg.binId;
    if (!binId) {
      binId = await jsonbinCreate(cfg.apiKey, state);
      cfg.binId = binId;
    } else {
      const remote = await jsonbinRead(cfg.apiKey, binId);
      if (remote && Array.isArray(remote.assignments) && (remote.updatedAt || 0) > (state.updatedAt || 0)) {
        state = remote;
        if (!state.settings) state.settings = {};
        if (typeof state.settings.urlaubstage !== 'number') state.settings.urlaubstage = 30;
        if (typeof state.settings.sollWochenstunden !== 'number') state.settings.sollWochenstunden = 40;
        await storageSet(LOCAL_KEY, JSON.stringify(state));
      } else {
        await jsonbinUpdate(cfg.apiKey, binId, state);
      }
    }
    cfg.lastSyncedAt = Date.now();
    setSyncConfig(cfg);
    ui.syncStatus = 'ok';
  } catch (e) {
    ui.syncStatus = 'error';
    ui.syncError = (e && e.message) ? e.message : 'Unbekannter Fehler beim Sync.';
    if (!silent) {
      showError('Sync fehlgeschlagen', ui.syncError);
    } else {
      // Automatischer Sync fehlgeschlagen (z.B. kurzzeitig kein Netz) - nach einer längeren Pause
      // selbstständig erneut versuchen, ohne dass der Nutzer etwas tun muss.
      clearTimeout(doSync._retryTimeout);
      doSync._retryTimeout = setTimeout(() => doSync(true), 30000);
    }
  }
  render();
  clearTimeout(doSync._resetTimeout);
  doSync._resetTimeout = setTimeout(() => { if (ui.syncStatus !== 'error') { ui.syncStatus = 'idle'; render(); } }, 4000);
}

async function backgroundPullOnLoad() {
  const cfg = getSyncConfig();
  if (!cfg || !cfg.binId) return;
  try {
    const remote = await jsonbinRead(cfg.apiKey, cfg.binId);
    if (remote && Array.isArray(remote.assignments) && (remote.updatedAt || 0) > (state.updatedAt || 0)) {
      state = remote;
      if (!state.settings) state.settings = {};
      if (typeof state.settings.urlaubstage !== 'number') state.settings.urlaubstage = 30;
      if (typeof state.settings.sollWochenstunden !== 'number') state.settings.sollWochenstunden = 40;
      await storageSet(LOCAL_KEY, JSON.stringify(state));
      cfg.lastSyncedAt = Date.now();
      setSyncConfig(cfg);
      render();
    }
  } catch (e) {
    // Offline oder Fehler beim automatischen Abgleich - lokale Daten bleiben unverändert, kein Popup (still im Hintergrund)
  }
}

/* ----------------------- persistence: Migration & Init ----------------------- */

async function tryMigrateOldClaudeData() {
  // Die allererste Version dieser App lief ausschließlich über Claudes Artifact-Speicher
  // unter einem anderen Schlüssel. Nur relevant, wenn wir gerade in diesem Modus laufen.
  if (storageBackend !== 'claude') return;
  try {
    const res = await window.storage.get(OLD_CLAUDE_STORAGE_KEY, false);
    if (res && res.value) {
      const parsed = JSON.parse(res.value);
      if (parsed && Array.isArray(parsed.assignments)) {
        state = parsed;
        state.updatedAt = Date.now();
        await storageSet(LOCAL_KEY, JSON.stringify(state));
      }
    }
  } catch (e) { /* keine alten Daten vorhanden - ignorieren */ }
}

async function init() {
  storageBackend = await detectStorageBackend();
  try {
    const raw = await storageGet(LOCAL_KEY);
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.assignments)) {
          state = parsed;
        } else {
          throw new Error('Unerwartetes Datenformat');
        }
      } catch (parseErr) {
        queueError('Gespeicherte Daten beschädigt',
          'Die gespeicherten Daten konnten nicht gelesen werden und wurden nicht geladen. Es wird mit einem leeren Stand gestartet. Falls du eine Sicherungsdatei hast, importiere sie unten über "Sicherung importieren".');
      }
    } else {
      await tryMigrateOldClaudeData();
    }
  } catch (e) {
    queueError('Daten konnten nicht geladen werden', 'Beim Laden ist ein unerwarteter Fehler aufgetreten. Es wird mit einem leeren Stand gestartet.');
  }
  if (!state.settings) state.settings = {};
  if (typeof state.settings.urlaubstage !== 'number') state.settings.urlaubstage = 30;
  if (typeof state.settings.sollWochenstunden !== 'number') state.settings.sollWochenstunden = 40;
  if (!Array.isArray(state.abwesenheiten)) state.abwesenheiten = [];
  loaded = true;
  if (storageBackend === 'memory') {
    queueError('Kein dauerhafter Speicher verfügbar',
      'Weder Claude-Speicher noch der Browser-Speicher sind hier verfügbar. Eingaben bleiben nur für diese Sitzung erhalten und gehen beim Schließen verloren. Bitte am Ende "Sicherung exportieren" nutzen, um nichts zu verlieren.');
  }
  // Beide Hintergrund-Ladevorgänge VOR dem ersten Render abschließen, statt sie im Hintergrund
  // nachzuziehen - sonst könnte ein verspäteter Render mitten in eine bereits begonnene
  // Formular-Eingabe hineinplatzen und sie zurücksetzen.
  await loadLaenderSaetze();
  await backgroundPullOnLoad();
  render();
}

/* ----------------------- CSV export ----------------------- */

function assignmentToRows(a) {
  return (a.tage || []).slice().sort((x, y) => (x.datum || '').localeCompare(y.datum || '')).map(d => ({
    Ort: a.ort || '',
    Kunde: a.kunde || '',
    Land: a.land || '',
    Datum: fmtDateDE(d.datum),
    ReiseStart: d.reiseStart || '',
    ReiseEnde: d.reiseEnde || '',
    Reisezeit_h: numDE(dayReise(d)),
    ArbeitStart: d.arbeitStart || '',
    ArbeitEnde: d.arbeitEnde || '',
    Arbeitszeit_h: numDE(dayArbeit(d)),
    Spesen_EUR: numDE(Number(d.spesen) || 0),
    Notiz: d.notiz || ''
  }));
}

function toCSV(rows) {
  if (rows.length === 0) return '';
  const headers = Object.keys(rows[0]);
  const escCsv = (v) => {
    let s = String(v === undefined || v === null ? '' : v);
    if (/[;"\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  const lines = [headers.join(';')];
  rows.forEach(r => lines.push(headers.map(h => escCsv(r[h])).join(';')));
  return lines.join('\r\n');
}

function downloadCSV(filename, csvContent) {
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportAllCSV() {
  const rows = state.assignments
    .slice().sort((a, b) => (a.start || '').localeCompare(b.start || ''))
    .flatMap(a => assignmentToRows(a));
  if (rows.length === 0) { showError('Keine Daten zum Exportieren', 'Es gibt noch keine Tage zum Exportieren.'); return; }
  downloadCSV(`dienstreise-stunden-gesamt-${todayISO()}.csv`, toCSV(rows));
}

function exportAssignmentCSV(id) {
  const a = state.assignments.find(x => x.id === id);
  if (!a) return;
  const rows = assignmentToRows(a);
  if (rows.length === 0) { showError('Keine Daten für diese Dienstreise', 'Für diese Dienstreise sind noch keine Tage erfasst.'); return; }
  const safeName = (a.land || 'dienstreise').toString().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  downloadCSV(`dienstreise-stunden-${safeName}-${a.start || ''}.csv`, toCSV(rows));
}

function importJSONFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result));
      if (!parsed || !Array.isArray(parsed.assignments)) {
        showError('Ungültige Sicherungsdatei', 'Diese Datei sieht nicht nach einer gültigen Sicherung aus (erwartet wird eine JSON-Datei mit "assignments").');
        return;
      }
      if (!confirm(`Sicherung importieren? ${parsed.assignments.length} Dienstreise(n) werden geladen und der aktuelle lokale Stand wird überschrieben.`)) return;
      state = parsed;
      if (!state.settings) state.settings = {};
      if (typeof state.settings.urlaubstage !== 'number') state.settings.urlaubstage = 30;
      if (typeof state.settings.sollWochenstunden !== 'number') state.settings.sollWochenstunden = 40;
      if (!Array.isArray(state.abwesenheiten)) state.abwesenheiten = [];
      persist();
      render();
    } catch (e) {
      showError('Datei konnte nicht gelesen werden', `Ist es eine gültige JSON-Sicherungsdatei? (${e && e.message ? e.message : 'Unbekannter Lesefehler'})`);
    }
  };
  reader.onerror = () => {
    showError('Datei konnte nicht gelesen werden', 'Die Datei konnte nicht vom Gerät geladen werden.');
  };
  reader.readAsText(file);
}

function renderTimeline() {
  const list = sortedAsc();
  if (list.length === 0) return '';
  const today = todayISO();
  const withRange = list.map(a => {
    const end = a.ende || (a.start <= today ? today : a.start);
    const dur = Math.max(daysBetweenInclusive(a.start, end), 1);
    return { a, end, dur };
  });
  const minStart = withRange[0].a.start;
  const maxEnd = withRange.reduce((m, r) => (r.end > m ? r.end : m), withRange[0].end);

  const segments = withRange.map((r, i) => {
    const grow = Math.max(r.dur, 1.2);
    const cls = i % 2 === 0 ? 'seg-a' : 'seg-b';
    const label = placeLabel(r.a);
    const title = `${esc(label)}: ${fmtDateDE(r.a.start)} – ${r.a.ende ? fmtDateDE(r.a.ende) : 'laufend'} (${r.dur} Tage)`;
    return `<div class="tl-seg ${cls}" style="flex-grow:${grow}" title="${title}">
        <span class="tl-seg-label">${esc(label)}</span>
      </div>`;
  }).join('');

  return `
    <section class="timeline-overview">
      <div class="timeline-bar">${segments}</div>
      <div class="timeline-range mono">
        <span>${fmtDateDE(minStart)}</span>
        <span>${maxEnd === today && !withRange[withRange.length - 1].a.ende ? 'heute' : fmtDateDE(maxEnd)}</span>
      </div>
    </section>`;
}

function renderYearSummary() {
  const years = yearsTouched();
  if (years.length === 0) return '';
  const urlaub = getUrlaubstage();
  const cards = years.map(y => {
    const s = yearStats(y);
    const pct = s.maxTage > 0 ? Math.min(Math.round((s.tageUnterwegs / s.maxTage) * 100), 100) : 0;
    const barClass = pct >= 90 ? 'year-bar-fill year-bar-fill-hot' : 'year-bar-fill';
    return `
      <div class="year-card">
        <div class="year-card-year mono">${y}</div>
        <div class="year-card-row"><span class="year-card-label">Einsätze</span><span class="year-card-value mono">${s.einsaetze}</span></div>
        <div class="year-bar-track"><div class="${barClass}" style="width:${pct}%"></div></div>
        <div class="year-card-ratio mono">${s.tageUnterwegs} von ${s.maxTage} Arbeitstagen unterwegs (${pct}%)</div>
        <div class="year-card-footer">Arbeitszeit ${fmtHours(s.arbeitH)} · Reisezeit ${fmtHours(s.reiseH)}${s.spesen > 0 ? ` · Spesen ${fmtEuro(s.spesen)}` : ''}</div>
      </div>`;
  }).join('');
  return `
    <section class="year-summary">
      <div class="year-summary-header">
        <h2>Jahresübersicht</h2>
        <label class="year-settings no-print">Urlaubstage/Jahr

    </section>`;
}

function renderWeekSummary() {
  const weeks = weeklyStats();
  if (weeks.length === 0) return '';
  const soll = getSollWochenstunden();
  const visible = ui.showAllWeeks ? weeks : weeks.slice(0, 10);
  const rows = visible.map(w => {
    const diff = Math.round((w.arbeitH - soll) * 100) / 100;
    const diffClass = diff >= 0 ? 'week-diff-pos' : 'week-diff-neg';
    const diffText = (diff >= 0 ? '+' : '−') + fmtHours(Math.abs(diff));
    return `
      <div class="week-row">
        <div class="mono">KW ${w.kw}</div>
        <div class="mono week-range">${fmtDateDE(w.monday)} – ${fmtDateDE(w.sonntag)}</div>
        <div class="mono">${fmtHours(w.arbeitH)}</div>
        <div class="mono week-soll">${fmtHours(soll)}</div>
        <div class="mono ${diffClass}">${diffText}</div>

  return `

const WEEKDAY_HEAD = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const MONTH_NAMES = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

function renderCalDay(dateISO, yearMonth) {
  const info = getDayInfo(dateISO);
  const inMonth = dateISO.slice(0, 7) === yearMonth;
  const isToday = dateISO === todayISO();
  const dayNum = Number(dateISO.slice(8, 10));

  const classes = ['cal-day'];
  if (!inMonth) classes.push('cal-day-outside');
  if (isToday) classes.push('cal-day-today');
  if (ui.selectedCalDay === dateISO) classes.push('cal-day-selected');

  // Priorität für Hintergrundfarbe: Abwesenheit > Dienstreise > Feiertag > Wochenende
  let tone = '';
  if (info.abwesenheit) tone = 'cal-tone-' + info.abwesenheit.typ;
  else if (info.dienstreisen.length > 0) tone = 'cal-tone-dienstreise';
  else if (info.holiday) tone = 'cal-tone-holiday';
  else if (info.weekend) tone = 'cal-tone-weekend';
  if (tone) classes.push(tone);

  let title = fmtDateDE(dateISO);
  if (info.holiday) title += ` – ${info.holiday}`;
  if (info.dienstreisen.length) title += ` – ${info.dienstreisen.map(a => placeLabel(a)).join(', ')}`;
  if (info.abwesenheit) title += ` – ${ABWESENHEIT_LABELS[info.abwesenheit.typ]}`;

  return `<button type="button" class="${classes.join(' ')}" data-action="select-cal-day" data-id="${dateISO}" title="${esc(title)}">
    <span class="cal-day-num">${dayNum}</span>
  </button>`;
}

function renderCalendarGrid() {
  const yearMonth = ui.calendarMonth || currentYearMonth();
  const weeks = getMonthGrid(yearMonth);
  const [y, m] = yearMonth.split('-').map(Number);

  const headerRow = `<div class="cal-week-row cal-week-row-header">
    <div class="cal-kw">KW</div>
    ${WEEKDAY_HEAD.map(w => `<div>${w}</div>`).join('')}
  </div>`;

  const bodyRows = weeks.map(week => `
    <div class="cal-week-row">
      <div class="cal-kw mono">${getISOWeekNumber(week[0])}</div>
      ${week.map(d => renderCalDay(d, yearMonth)).join('')}
    </div>`).join('');

  return `
    <div class="calendar-header">
      <button type="button" class="icon-btn" data-action="cal-prev" aria-label="Vorheriger Monat">‹</button>
      <div class="calendar-month-label">${MONTH_NAMES[m - 1]} ${y}</div>
      <button type="button" class="icon-btn" data-action="cal-next" aria-label="Nächster Monat">›</button>
      <button type="button" class="link-btn no-print" data-action="cal-today">Heute</button>
    </div>

      <span><i class="legend-dot cal-tone-dienstreise"></i>Dienstreise</span>
      <span><i class="legend-dot cal-tone-holiday"></i>Feiertag</span>
      <span><i class="legend-dot cal-tone-weekend"></i>Wochenende</span>
      <span><i class="legend-dot cal-tone-urlaub"></i>Urlaub</span>
      <span><i class="legend-dot cal-tone-krankheit"></i>Krankheit</span>
      <span><i class="legend-dot cal-tone-sonderurlaub"></i>Sonderurlaub</span>
    </div>
    <div class="calendar-grid">${headerRow}${bodyRows}</div>`;
}

function fmtDateTimeDE(ts) {
  if (!ts) return null;
  const d = new Date(ts);
  return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}. ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderSyncBar() {
  const cfg = getSyncConfig();
  const pending = hasPendingChanges();
  const running = ui.syncStatus === 'running';

  let btnLabel = 'Cloud-Sync einrichten';
  let btnClass = 'btn btn-ghost';
  if (cfg) {
    btnLabel = running ? 'Synchronisiere …' : '⟳ Sync';
    btnClass = pending ? 'btn btn-primary sync-pending' : 'btn btn-ghost';
  }

  let statusText = '';
  if (!cfg) {
    statusText = 'Noch kein Cloud-Sync eingerichtet – Daten bleiben lokal auf diesem Gerät.';
  } else if (running) {
    statusText = 'Synchronisiere …';
  } else if (ui.syncStatus === 'error') {
    statusText = `Sync fehlgeschlagen: ${esc(ui.syncError || '')}`;
  } else if (pending) {
    statusText = 'Synchronisiert in Kürze automatisch …';
  } else if (ui.syncStatus === 'ok') {
    statusText = 'Synchronisiert ✓';
  } else if (cfg.lastSyncedAt) {
    statusText = `Zuletzt synchronisiert: ${fmtDateTimeDE(cfg.lastSyncedAt)}`;
  } else {
    statusText = 'Verbunden – noch nicht synchronisiert';
  }

  const binIdShort = cfg && cfg.binId ? `<span class="sync-binid-chip" title="Bin-ID: ${esc(cfg.binId)} – muss auf allen Geräten identisch sein">🔑 …${esc(cfg.binId.slice(-6))}</span>` : '';

  return `
    <div class="sync-bar no-print">
      <button class="${btnClass} btn-sm" data-action="do-sync" ${running ? 'disabled' : ''}>${btnLabel}</button>
      <span class="sync-status-text ${ui.syncStatus === 'error' ? 'err' : ''}">${statusText}</span>
      ${binIdShort}
      <div class="toolbar-spacer"></div>
      ${cfg ? `<button class="link-btn" data-action="toggle-sync-settings">Verbindung</button>` : ''}
    </div>
    ${renderSyncSettingsPanel(cfg)}`;
}

function renderDayRow(a, d) {
  if (ui.editingDayId === d.id) return renderDayEditForm(a, d);
  const reiseH = dayReise(d);
  const arbeitH = dayArbeit(d);
  const hasReise = d.reiseStart && d.reiseEnde;
  const hasArbeit = d.arbeitStart && d.arbeitEnde;
  const wd = weekdayAbbr(d.datum);
  const weekend = isWeekendISO(d.datum);
  const holidayName = isGermanAssignment(a) ? germanHolidayName(d.datum) : null;
  const rowClasses = ['day-row'];
  if (holidayName) rowClasses.push('day-row-holiday');
  else if (weekend) rowClasses.push('day-row-weekend');
  return `
    <div class="${rowClasses.join(' ')}">
      <div class="d-field"><span class="field-label">Datum</span>
        <span class="mono d-datum"><b class="d-weekday">${wd}</b> ${fmtDateDE(d.datum)}</span>
        ${holidayName ? `<span class="holiday-badge" title="${esc(holidayName)}">Feiertag</span>` : ''}
      </div>
      <div class="d-field"><span class="field-label">Reise</span>
        ${hasReise
          ? `<span class="mono">${d.reiseStart}–${d.reiseEnde}</span><span class="d-hours travel-color mono">${fmtHours(reiseH)}</span>`
          : '<span class="d-empty">–</span>'}
      </div>
      <div class="d-field"><span class="field-label">Arbeit</span>
        ${hasArbeit
          ? `<span class="mono">${d.arbeitStart}–${d.arbeitEnde}</span><span class="d-hours work-color mono">${fmtHours(arbeitH)}</span>${dayArbeitPauseMin(d) > 0 ? `<span class="d-pause-note">− ${dayArbeitPauseMin(d)} Min. Pause</span>` : ''}`

      </div>
      <div class="d-field"><span class="field-label">Spesen</span>
        ${Number(d.spesen) > 0 ? `<span class="mono">${fmtEuro(Number(d.spesen))}</span>` : '<span class="d-empty">–</span>'}
        ${(d.fruehstueck || d.mittag || d.abend) ? `<span class="meal-icons" title="${[d.fruehstueck && 'Frühstück', d.mittag && 'Mittagessen', d.abend && 'Abendessen'].filter(Boolean).join(', ')} gestellt">${d.fruehstueck ? '🥐' : ''}${d.mittag ? '🍽️' : ''}${d.abend ? '🌙' : ''}</span>` : ''}

      </div>
    </div>`;
}

function renderVerpflegungBlock(a, existingDay, dateISO, existingSpesen) {
  const hasTagessatz = a.tagessatz > 0;
  const edge = isEdgeDay(a, dateISO);
  const isGerman = isGermanAssignment(a);
  const suggestion = (hasTagessatz && !(existingSpesen && Number(existingSpesen) > 0))
    ? verpflegungBetrag(a.tagessatz, edge, false, false, false, isGerman)
    : null;
  const fr = !!(existingDay && existingDay.fruehstueck);
  const mi = !!(existingDay && existingDay.mittag);
  const ab = !!(existingDay && existingDay.abend);
  const edgeLabel = isGerman ? 'An-/Abreisetag = 14 €' : 'An-/Abreisetag = ⅔';
  const label = hasTagessatz
    ? `🍽️ Verpflegung (${esc(a.land)}, ${fmtEuro(a.tagessatz)}/Tag, ${edge ? edgeLabel : 'voller Tag'})`
    : '🍽️ Mahlzeiten an diesem Tag (für die eigene Übersicht)';
  return {
    html: `
      <div class="verpflegung-calc field-wide">
        <div class="verpflegung-calc-label">${label}</div>
        <div class="verpflegung-checks">
          <label><input type="checkbox" class="verpflegung-check" name="mahlzeit_fruehstueck" ${fr ? 'checked' : ''}> Frühstück gestellt</label>
          <label><input type="checkbox" class="verpflegung-check" name="mahlzeit_mittag" ${mi ? 'checked' : ''}> Mittagessen gestellt</label>
          <label><input type="checkbox" class="verpflegung-check" name="mahlzeit_abend" ${ab ? 'checked' : ''}> Abendessen gestellt</label>
        </div>
      </div>`,
    suggestion
  };
}

      <div class="day-list">
        ${(a.tage || []).slice().sort((x, y) => (x.datum || '').localeCompare(y.datum || '')).map(d => renderDayRow(a, d)).join('')}

      <div class="day-row day-row-total">

function renderList() {
  if (state.assignments.length === 0) {
    return `
      <div class="empty-state">
        <div class="empty-state-title">Noch keine Dienstreise erfasst</div>
        <p>Nutze "+ Neue Dienstreise" oben, um deinen ersten Einsatz anzulegen.</p>
      </div>`;
  }
  const asc = sortedAsc();
  const seqMap = new Map();
  asc.forEach((a, i) => seqMap.set(a.id, i + 1));
  const desc = [...asc].reverse();
  return `<div class="card-list">${desc.map(a => renderAssignmentCard(a, seqMap.get(a.id))).join('')}</div>`;
}

function renderLaenderSaetzeNotice() {
  if (!countryRatesByYear) return '';
  const latest = latestRatesYear();
  if (!latest) return '';
  const latestData = countryRatesByYear[String(latest)] || {};
  const jahreVerfuegbar = Object.keys(countryRatesByYear).length;
  const veraltet = laenderTabelleVeraltet();
  const unvollstaendig = latestData.vollstaendig === false;
  if (!veraltet && !unvollstaendig) {
    return `<span class="footer-hint">Länder-Tagessätze: ${esc(String(jahreVerfuegbar))} Jahr(e) hinterlegt, neuestes ${esc(String(latest))} (${esc(latestData.quelle || '')}). Historische Dienstreisen nutzen automatisch den Satz ihres Jahres.</span>`;
  }
  const parts = [];
  if (veraltet) parts.push(`neuestes Jahr ${esc(String(latest))} evtl. veraltet`);
  if (unvollstaendig) parts.push(`${esc(String(latest))} bisher nur einzelne Länder erfasst`);
  return `<span class="footer-hint footer-hint-warn">⚠️ Länder-Tagessätze: ${parts.join(', ')} – aktuelle Liste auf bundesfinanzministerium.de prüfen.</span>`;
}


function footerStorageText() {
  if (storageBackend === 'claude') return 'Daten werden hier in Claude gespeichert (dieses Artifact).';
  if (storageBackend === 'local') return 'Daten liegen lokal in diesem Browser.';
  return '⚠️ Kein dauerhafter Speicher verfügbar – Daten gehen beim Schließen verloren, bitte Sicherung exportieren.';
}

    ${renderTimeline()}

    ${renderWeekSummary()}

    ${renderToolbar()}

      <div class="employee-settings">
